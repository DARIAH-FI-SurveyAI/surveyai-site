<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}

  <section class="task-hero">
    <div class="wrap">
      <a class="breadcrumb" href="{{ '/' | relative_url }}">&larr; Back to SurveyAI</a>
      {% if page.task_id %}<div class="task-tag">{{ page.task_id }}</div>{% endif %}
      <h1>{{ page.title }}</h1>
    </div>
  </section>

  <section class="task-content">
    <div class="wrap">
      {{ content }}
    </div>
  </section>

  {% include footer.html %}
</body>
</html>
